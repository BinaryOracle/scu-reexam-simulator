<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preserve installed Linux rules; explicitly include macOS fonts for headless LibreOffice. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>SimSun</family><prefer><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>宋体</family><prefer><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>NSimSun</family><prefer><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>SimHei</family><prefer><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>黑体</family><prefer><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>Microsoft YaHei</family><prefer><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>微软雅黑</family><prefer><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>FangSong</family><prefer><family>STFangsong</family><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>KaiTi</family><prefer><family>STKaiti</family><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Arial</family><family>Heiti SC</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Songti SC</family><family>Noto Serif CJK SC</family></prefer></alias>
</fontconfig>
