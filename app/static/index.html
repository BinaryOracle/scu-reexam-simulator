<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复试模拟系统</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>复试模拟系统</h1><span id="identity"></span></header><main><div id="login"><h2>登录</h2><input id="username" placeholder="用户名"><input id="password" type="password" placeholder="密码"><button onclick="login()">登录</button></div><div id="app" hidden><nav><button onclick="show('interview')">模拟面试</button><button onclick="show('contest')">模拟上机</button><button onclick="logout()">退出</button></nav><p id="message" role="status"></p><section id="interview"><h2>模拟面试</h2><button id="newInterview" onclick="startInterview()">开始面试</button><div id="interviewList"></div><div id="interviewDetail"></div></section><section id="contest" hidden><h2>模拟上机</h2><div id="teacherTools" hidden><h3>创建比赛</h3><input id="contestTitle" placeholder="比赛名称"><label>开始 <input id="starts" type="datetime-local"></label><label>结束 <input id="ends" type="datetime-local"></label><button onclick="createContest()">创建</button><h3>添加题目</h3><input id="contestId" type="number" placeholder="比赛编号"><input id="problemTitle" placeholder="题目名称"><textarea id="statement" placeholder="题目描述"></textarea><textarea id="sampleInput" placeholder="样例输入"></textarea><textarea id="sampleOutput" placeholder="样例输出"></textarea><textarea id="tests" placeholder='测试数据 JSON，例如 [{"input":"1 2\n","output":"3\n"}]'></textarea><button onclick="createProblem()">添加</button></div><div id="contestList"></div><div id="problemList"></div><div id="submissions"></div></section></div></main><script src="/static/app.js"></script></body></html>
